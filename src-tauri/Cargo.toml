[package]
name = "whatsapp-tauri"
version = "1.0.0"
description = "Lightweight WhatsApp Desktop Client"
authors = ["VUXXE"]
edition = "2021"

[lib]
name = "whatsapp_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
open = "5"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
